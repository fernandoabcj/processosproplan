<style>
/* Layout: barra institucional fixa com abas; conteúdo em coluna única de até 1240px; painel → setores → estoque → alertas. */

  --s1:#1c6fa8; --s2:#7a4fb0; --s3:#b0611c; --s4:#2f8a57; --s5:#b0306b; --s6:#0b5c6b;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11181c; --surface:#182227; --surface2:#1f2b31; --fg:#e4ebee; --muted:#93a4ad; --line:#2b3a41;
  --accent:#5cc0d2; --accent-soft:#16363e; --on-accent:#0b1a1e;
  --warn:#f0b65a; --warn-soft:#3a2c14; --crit:#f2867e; --crit-soft:#3d1c1a; --ok:#7fd39b; --ok-soft:#173222;
  --ext:#46565e;
  --s1:#6cb3e6; --s2:#b596e3; --s3:#e8a062; --s4:#72c995; --s5:#ec82b3; --s6:#5cc0d2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181c; --surface:#182227; --surface2:#1f2b31; --fg:#e4ebee; --muted:#93a4ad; --line:#2b3a41;
  --accent:#5cc0d2; --accent-soft:#16363e; --on-accent:#0b1a1e;
  --warn:#f0b65a; --warn-soft:#3a2c14; --crit:#f2867e; --crit-soft:#3d1c1a; --ok:#7fd39b; --ok-soft:#173222;

  --s1:#6cb3e6; --s2:#b596e3; --s3:#e8a062; --s4:#72c995; --s5:#ec82b3; --s6:#5cc0d2; color-scheme:dark}
*{box-sizing:border-box}

<script>
"use strict";
/* ================================================================ utilidades */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim().toUpperCase();
const limpa = s => String(s||"").replace(/\s+/g," ").trim();
const nf1 = new Intl.NumberFormat("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
const n1 = x => nf1.format(x||0);
const DIA = 86400000;
/* Tempo legível: 1,5 dia -> "1 dia 12h"; 0,2 dia -> "4h 48min"; menos de 1 h -> "35 min". */
const uteisTxt = n => `${n} ${n === 1 ? "dia útil" : "dias úteis"}`;
function dur(d){
  if (d == null || isNaN(d)) return "—";
  const min = Math.round(d*1440);
  if (min < 60) return `${min} min`;
  const dias = Math.floor(min/1440), h = Math.floor((min%1440)/60), m = min%60;
  if (!dias) return m ? `${h}h ${m}min` : `${h}h`;
  return `${dias} ${dias === 1 ? "dia" : "dias"}${h ? ` ${h}h` : ""}`;
}
const RE_PROC = /(?<!\d)(\d{5})\s*[.\-]?\s*(\d{6})\s*\/\s*(\d{4})\s*-?\s*(\d{2})(?!\d)/;
const RE_PROC_G = new RegExp(RE_PROC.source, "g");
const RE_DATA = /(\d{2})\/(\d{2})\/(\d{4})(?:\s+(?:às\s+)?(\d{1,2}):(\d{2})(?::(\d{2}))?)?/;
const ARTIFACT_URL = "https://claude.ai/artifact/QAgHaMxz1gbo8YLwoe9ubA";
const ROTINA = "trig_01Sbnhk7Hm8RJehKubr3H3zi";
const URL_SIPAC = "https://sipac.ufpb.br/public/jsp/processos/consulta_processo.jsf";

function numProc(t){ const m = RE_PROC.exec(t||""); return m ? {fmt:`${m[1]}.${m[2]}/${m[3]}-${m[4]}`, chave:m.slice(1,5).join("")} : null; }
function todosNums(t){ const out = new Map(); for (const m of String(t||"").matchAll(RE_PROC_G)) out.set(m.slice(1,5).join(""), `${m[1]}.${m[2]}/${m[3]}-${m[4]}`); return out; }
function parseData(t){
  const m = RE_DATA.exec(t||""); if(!m) return null;
  const d = new Date(+m[3], +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0), +(m[6]||0));
  return isNaN(d) ? null : d;
}
const iso = d => d ? new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16) : null;
const deIso = s => s ? new Date(s) : null;
const fd = (d, hora) => { if(!d) return "—"; const p = n => String(n).padStart(2,"0");
  let s = `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;
  if (hora && (d.getHours()||d.getMinutes())) s += ` ${p(d.getHours())}:${p(d.getMinutes())}`; return s; };
const diasEntre = (a,b) => Math.max((b-a)/DIA, 0);

/* Feriados nacionais (fixos e móveis), ponto facultativo de Carnaval e feriado municipal de João Pessoa (05/08). */
function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;return new Date(y,mes-1,dia);}
const _fer = new Map();
function chaveDia(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function feriadosAno(y){
  if (_fer.has(y)) return _fer.get(y);
  const s = new Set(["01-01","04-21","05-01","08-05","09-07","10-12","11-02","11-15","11-20","12-25"].map(x=>`${y}-${x}`));
  const p = pascoa(y); for (const off of [-48,-47,-2,60]) s.add(chaveDia(new Date(p.getFullYear(),p.getMonth(),p.getDate()+off)));
  _fer.set(y,s); return s;
}
function diasUteis(a, b, extras){
  if (!a || !b || b <= a) return 0;
  let d = new Date(a.getFullYear(), a.getMonth(), a.getDate()+1); const fim = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  let n = 0;
  while (d <= fim){ const k = chaveDia(d); if (d.getDay()%6 !== 0 && !feriadosAno(d.getFullYear()).has(k) && !extras.has(k)) n++; d.setDate(d.getDate()+1); }
  return n;
}

/* ================================================================ configuração de setores */
const CFG_PADRAO = {
  setores: [
    {sigla:"CODEOR", nome:"Coordenação de Orçamento", codigos:["11.01.07.04"], padroes:["^PROPLAN\\b.*COORDENACAO DE ORCAMENTO","\\bCODEOR\\b"]},
    {sigla:"CODEINFO", nome:"Coordenação de Informação", codigos:["11.00.61.01"], padroes:["^PROPLAN\\b.*COORDENACAO DE INFORMAC","\\bCODEINFO\\b"]},
    {sigla:"CODECON", nome:"Coordenação de Convênios", codigos:["11.01.07.06"], padroes:["^PROPLAN\\b.*COORDENACAO DE CONVENIOS","\\bCODECON\\b"]},
    {sigla:"CODEPLAN", nome:"Coordenação de Planejamento", codigos:["11.01.07.05"], padroes:["^PROPLAN\\b.*COORDENACAO DE PLANEJAMENTO","\\bCODEPLAN\\b"]},
    {sigla:"SECRETARIA", nome:"Secretaria Executiva", codigos:["11.00.61.02"], padroes:["^PROPLAN\\b.*SECRETARIA","SECRETARIA.*(PROPLAN|PRO-REITORIA DE PLANEJAMENTO)"]},
    {sigla:"PROPLAN", nome:"PROPLAN (Gabinete)", codigos:["11.00.61","11.00.61.*"], padroes:["^PROPLAN\\b","PRO-REITORIA DE PLANEJAMENTO"]},
  ],
  limite_parado: 15, limite_receb: 3, limite_passagens: 3, feriados_extras: [],
};
function compilarCfg(raw){
  const c = JSON.parse(JSON.stringify(raw || CFG_PADRAO));
  c.setores = (c.setores||[]).map((s,i) => ({...s, cor:`var(--s${(i%6)+1})`,
    _rx:(s.padroes||[]).map(p=>{try{return new RegExp(p)}catch{return null}}).filter(Boolean)}));
  c._fer = new Set((c.feriados_extras||[]).map(f => { const d = parseData(f); return d ? chaveDia(d) : f; }));
  c._cache = new Map();
  c.setorDe = u => {
    if (!u) return null; if (c._cache.has(u)) return c._cache.get(u);
    const cod = (/\((\d{2}(?:\.\d{2})+)\)/.exec(u)||[])[1]; const n = norm(u); let r = null;
    const casaCod = s => cod && (s.codigos||[]).some(k => k === cod || (k.endsWith(".*") && (cod === k.slice(0,-2) || cod.startsWith(k.slice(0,-1)))));
    for (const s of c.setores){ if (casaCod(s) || s._rx.some(rx=>rx.test(n))){ r = s.sigla; break; } }
    c._cache.set(u, r); return r;
  };
  c.cor = sig => (c.setores.find(s=>s.sigla===sig)||{}).cor || "var(--ext)";
  c.nome = sig => (c.setores.find(s=>s.sigla===sig)||{}).nome || sig;
  return c;
}

/* ================================================================ leitura da página do SIPAC */
function tipoColuna(t){
  t = norm(t);
  if (t.includes("URGENT")) return "urgente";
  if (t.includes("RECEB")) return (t.includes("POR")||t.includes("USUARIO")||t.includes("RECEBEDOR")) ? "recebido_por" : "data_receb";
  if (t.includes("ENVIADO POR")||t.includes("REMETENTE")||t.includes("USUARIO")) return "enviado_por";
  if (t.includes("DESTINO")) return t.startsWith("DATA") ? "data_destino" : "destino";
  if (t.includes("ORIGEM")) return t.startsWith("DATA") ? "data_envio" : "origem";
  if (t.startsWith("DATA")||t.includes("ENVIO")) return "data_envio";
  return null;
}
const semData = t => limpa(String(t||"").replace(/\d{2}\/\d{2}\/\d{4}(\s+\d{1,2}:\d{2}(:\d{2})?)?/g,""));

/* Recebe "tabelas" como listas de linhas (cada linha = lista de células) e monta o processo. */
function montarProcesso(tabelas, textoTotal){
  const campos = {};
  for (const tab of tabelas) for (const cel of tab){
    for (let i=0;i<cel.length-1;i++){
      const r = cel[i]; if (!r.endsWith(":") || r.length>60) continue;
      const k = norm(r.slice(0,-1)); if (!(k in campos)) campos[k] = cel[i+1];
    }
  }
  const campo = (...ks) => { for (const k of ks) if (k in campos) return campos[k];
    for (const k of ks) for (const c in campos) if (c.startsWith(k)) return campos[c]; return ""; };

  let movs = [];
  achou: for (const tab of tabelas){
    for (let i=0;i<tab.length;i++){
      const cab = tab[i]; if (cab.length < 3) continue;
      const mapa = {}; cab.forEach((t,idx) => { const k = tipoColuna(t); if (k && !(k in mapa)) mapa[k] = idx; });
      if (!("origem" in mapa && "destino" in mapa)) continue;
      const nmin = Math.max(...Object.values(mapa)) + 1;
      const pega = (c,k) => (mapa[k] !== undefined && mapa[k] < c.length) ? c[mapa[k]] : "";
      for (const c of tab.slice(i+1)){
        if (c.length < nmin) continue;
        const o = pega(c,"origem"), d = pega(c,"destino");
        if (!o && !d) continue;
        const env = parseData(pega(c,"data_envio")) || parseData(o); if (!env) continue;
        let rec = parseData(pega(c,"data_receb")) || parseData(pega(c,"data_destino"));
        if (!rec && !("data_receb" in mapa)) rec = parseData(d);
        movs.push({envio:iso(env), origem:semData(o), destino:semData(d), enviado_por:pega(c,"enviado_por"),
          receb:iso(rec), recebido_por:pega(c,"recebido_por"), urgente:["SIM","S","X"].includes(norm(pega(c,"urgente")))});
      }
      if (movs.length) break achou;
    }
  }
  if (movs.length > 1 && movs[0].envio > movs[movs.length-1].envio) movs.reverse();
  movs = movs.map((m,i)=>({...m,_i:i})).sort((a,b)=> a.envio < b.envio ? -1 : a.envio > b.envio ? 1 : a._i-b._i).map(({_i,...m})=>m);

  const num = numProc(campo("PROCESSO","NUMERO DO PROCESSO","NUMERO")) || numProc(textoTotal);
  if (!num) throw new Error("Não encontrei o número do processo no conteúdo colado. Copie a página de detalhes do processo (a que mostra as movimentações).");
  let interessados = [];
  for (const tab of tabelas){
    const t0 = norm((tab._titulo||"") + " " + (tab[0]||[]).join(" "));
    if (t0.includes("INTERESSAD") || (t0.includes("NOME") && t0.includes("IDENTIFICADOR"))){
      interessados = tab.slice(1).filter(c => c.length && !String(c[0]).endsWith(":")).map(c => c.filter(Boolean).join(" - ")).filter(Boolean).slice(0,10);
      if (interessados.length) break;
    }
  }
  const assunto = campos["ASSUNTO"] || campos["ASSUNTO DO PROCESSO"] || "";
  return {
    numero:num.fmt, chave:num.chave, assunto, assunto_detalhado:campo("ASSUNTO DETALHADO"),
    natureza:campo("NATUREZA","NATUREZA DO PROCESSO"), status:campo("STATUS","SITUACAO"),
    autuacao:iso(parseData(campo("DATA DE AUTUACAO","AUTUADO EM","DATA DE CADASTRO"))),
    origem:campo("UNIDADE DE ORIGEM","UNIDADE ORIGEM"), interessados, movs,
  };
}

function lerHTML(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll("script,style,noscript").forEach(e=>e.remove());
  const tabelas = [...doc.querySelectorAll("table")].map(t => {
    const linhas = [...t.querySelectorAll("tr")].filter(tr => tr.closest("table") === t && !tr.querySelector("table"))
      .map(tr => [...tr.children].filter(c=>/^T[DH]$/.test(c.tagName)).map(c => limpa(c.textContent)));
    const cap = t.querySelector("caption"); linhas._titulo = cap ? cap.textContent : "";
    let prev = t.previousElementSibling; if (!linhas._titulo && prev) linhas._titulo = prev.textContent.slice(0,80);
    return linhas;
  });
  const texto = doc.body ? doc.body.textContent : html;
  if (!tabelas.some(t=>t.length)) return lerTexto(doc.body ? doc.body.innerText || texto : texto);
  return montarProcesso(tabelas, texto);
}
function lerTexto(txt){
  const linhas = String(txt).split(/\r?\n/).map(l => l.split("\t").map(limpa)).filter(c => c.some(Boolean));
  const extra = [];
  for (const l of linhas){ if (l.length === 1){ const m = /^([^:]{2,60}:)\s*(.+)$/.exec(l[0]); if (m) extra.push([m[1], m[2]]); } }
  return montarProcesso([linhas, extra], txt);
}

/* ================================================================ análise */
const ENCERRADO = ["ARQUIV","CONCLU","FINALIZ","ENCERRAD","CANCELAD"];
function analisar(p, cfg, ref){
  const status = norm(p.status), encerrado = ENCERRADO.some(s=>status.includes(s));
  const movs = (p.movs||[]).map(m => ({...m, envio:deIso(m.envio), receb:deIso(m.receb)})).filter(m=>m.envio);
  const perms = [];
  const nova = (unidade, inicio, receb, fim, veio, foi) => {
    const f = fim || ref;
    perms.push({unidade, setor:cfg.setorDe(unidade), inicio, receb, fim, veio, foi:foi||"",
      dias:diasEntre(inicio,f), uteis:diasUteis(inicio,f,cfg._fer),
      aguard: receb ? diasEntre(inicio,receb) : (fim ? 0 : diasEntre(inicio,ref))});
  };
  const aut = deIso(p.autuacao);
  if (movs.length){
    const ini = aut || movs[0].envio;
    if (ini <= movs[0].envio) nova(movs[0].origem || p.origem, ini, ini, movs[0].envio, "(autuação)", movs[0].destino);
    movs.forEach((m,i) => { const px = movs[i+1]; nova(m.destino, m.envio, m.receb, px ? px.envio : null, m.origem, px ? px.destino : ""); });
  } else if (aut) nova(p.origem, aut, aut, null, "(autuação)");

  const a = {p, perms, encerrado, alertas:[], porSetor:{}, uteisSetor:{}, passagens:{}, totalProplan:0};
  if (!perms.length){ a.alertas.push("Sem movimentações legíveis"); return a; }
  const at = perms[perms.length-1];
  Object.assign(a, {unidade:at.unidade, setor:at.setor, diasAtual:at.dias, uteisAtual:at.uteis,
    aguardando: !at.receb && !encerrado, tramitacao:diasEntre(perms[0].inicio, ref), atual:at});
  a.naProplan = !!at.setor && !encerrado;
  for (const x of perms){ if (!x.setor) continue;
    a.porSetor[x.setor] = (a.porSetor[x.setor]||0) + x.dias; a.uteisSetor[x.setor] = (a.uteisSetor[x.setor]||0) + x.uteis;
    a.passagens[x.setor] = (a.passagens[x.setor]||0) + 1; a.totalProplan += x.dias;
    if (!a.entradaProplan) a.entradaProplan = x.inicio; }
  a.passou = Object.keys(a.passagens).length > 0;
  if (a.naProplan){
    if (a.diasAtual >= cfg.limite_parado) a.alertas.push({nivel:"crit", t:`Parado há ${Math.floor(a.diasAtual)} dias em ${a.setor}`});
    if (a.aguardando && a.diasAtual >= cfg.limite_receb) a.alertas.push({nivel:"warn", t:`Aguardando recebimento em ${a.setor} há ${Math.floor(a.diasAtual)} dias`});
  }
  for (const [s,n] of Object.entries(a.passagens)) if (n >= cfg.limite_passagens) a.alertas.push({nivel:"warn", t:`${n} passagens por ${s} (idas e vindas)`});
  const semReceb = perms.find(x => x.setor && x.fim && !x.receb);
  if (semReceb) a.alertas.push({nivel:"neu", t:`Saiu de ${semReceb.setor} em ${fd(semReceb.fim)} sem registro de recebimento`});
  return a;
}
const med = v => { if(!v.length) return 0; const s=[...v].sort((a,b)=>a-b), m=s.length>>1; return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
const media = v => v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0;
function consolidar(as, cfg, alvo){
  const dentro = sig => alvo ? sig === alvo : !!sig;
  const rot = u => alvo ? (cfg.setorDe(u) || u) : u;
  const st = Object.fromEntries(cfg.setores.map(s=>[s.sigla,{sigla:s.sigla,nome:s.nome,cor:s.cor,procs:0,pass:0,dias:[],aguard:[],estoque:0,idade:[],acima:0}]));
  const entradas = new Map(), saidas = new Map(); const inc = (m,k)=>m.set(k,(m.get(k)||0)+1);
  for (const a of as){
    const vistos = new Set();
    for (const x of a.perms){
      if (x.setor && st[x.setor]){ const s = st[x.setor]; s.pass++; vistos.add(x.setor); if (x.fim) s.dias.push(x.dias); if (x.receb) s.aguard.push(x.aguard); }
      if (dentro(x.setor)){
        if (x.veio && x.veio !== "(autuação)" && !dentro(cfg.setorDe(x.veio))) inc(entradas, rot(x.veio));
        if (x.foi && !dentro(cfg.setorDe(x.foi))) inc(saidas, rot(x.foi));
      }
    }
    vistos.forEach(s => st[s].procs++);
    if (a.naProplan && st[a.setor]){ const s = st[a.setor]; s.estoque++; s.idade.push(a.diasAtual); if (a.diasAtual >= cfg.limite_parado) s.acima++; }
  }
  return {setores:Object.values(st), entradas, saidas};
}

/* Última vez que o processo foi conferido no SIPAC: a rotina só regrava o que mudou,
   então vale a última execução sem falha para ele, ou a última mudança registrada. */
function conferidoEm(p){
  const st = S.status, mud = p?.atualizado_em ? new Date(p.atualizado_em) : null;
  if (!p) return null;
  if (st?.ultima_execucao && !st.erro_geral && !(st.falhas||[]).some(f => f.numero === p.numero)) {
    const ex = new Date(st.ultima_execucao);
    const encerrado = ENCERRADO.some(x => norm(p.status).includes(x));
    if (!encerrado || st.modo !== "agendado" || !st.pulados_encerrados) return mud && mud > ex ? mud : ex;
  }
  return mud;
}
function cadastradoNo(sig, chave){ return !!S.chavesPor[sig]?.has(chave); }
function enriquecer(a){
  const v = V();
  a.noAlvo = v ? (a.setor === v && !a.encerrado) : !!a.naProplan;
  a.passouAlvo = v ? (!!a.passagens[v] || cadastradoNo(v, a.p.chave)) : (a.passou || cadastradoNo("_geral", a.p.chave));
  a.tempoAlvo = v ? (a.porSetor[v] || 0) : a.totalProplan;
  a.alertasAlvo = v ? a.alertas.filter(x => (x.t||"").includes(v)) : a.alertas;
  return a;
}

async function salvarProcesso(p){
  const doc = {...p, atualizado_em:new Date().toISOString(), atualizado_por:S.uid || null};
  if (S.db){

      if (e && e.code === "quota_exceeded") throw new Error("O limite de armazenamento foi atingido. Remova processos antigos.");
      throw new Error("Não foi possível salvar agora. Tente de novo em instantes.");

async function importar(conteudos){
  let ok = 0; const erros = [];
  for (const {html, texto, nome} of conteudos){

      if (!p.movs.length) throw new Error(`${p.numero}: nenhuma movimentação encontrada. Copie a página completa de detalhes do processo.`);
      await salvarProcesso(p); ok++; S.ultimo = p.chave;
      const k = V() || "_geral"; if (!(S.listaPor[k]||[]).includes(p.numero)) { try { await gravarLista({...S.listaPor, [k]: [...(S.listaPor[k]||[]), p.numero]}); } catch {} }
    } catch(e){ erros.push((nome ? nome + ": " : "") + e.message); }
  }
  S.erros = erros;
  if (ok) toast(ok === 1 ? `Processo ${S.reais.get(S.ultimo)?.numero || ""} salvo.` : `${ok} processos salvos.`);
  else if (erros.length) toast("Nada foi salvo. Veja o motivo abaixo.");

}

    <div class="kpi"><span class="v">${hoje.length}</span><span class="l">estão hoje ${v ? "na " + esc(v) : "em unidade da PROPLAN"}</span></div>
    <div class="kpi ${parados.length?"crit":""}"><span class="v">${parados.length}</span><span class="l">parados há ${cfg.limite_parado} dias ou mais</span></div>
    <div class="kpi ${aguard.length?"warn":""}"><span class="v">${aguard.length}</span><span class="l">aguardando recebimento</span></div>
    <div class="kpi"><span class="v">${dur(mediaPP)}</span><span class="l">${v ? "tempo médio por passagem na " + esc(v) : "tempo médio de cada processo dentro da PROPLAN"}</span></div>
  </div>
  <section class="sec"><div class="sec-head"><h2>${v ? "Desempenho do setor" : "Desempenho por setor"}</h2><span class="note">Tempo corrido. Média, mediana e máximo contam só passagens concluídas.</span></div>
    ${tabela("t-set",[{t:"Setor"},{t:"Processos",n:1},{t:"Passagens",n:1},{t:"Tempo médio por passagem",n:1},{t:"",ns:1},{t:"Mediana",n:1},{t:"Máximo",n:1},{t:"Média até receber",n:1},{t:"Estoque hoje",n:1},{t:"Idade média",n:1},{t:`≥ ${cfg.limite_parado} dias`,n:1}], linhasSet)}
  </section>
  <section class="sec"><div class="sec-head"><h2>${v ? "Processos na " + esc(v) + " agora" : "Onde está cada processo hoje"}</h2><span class="note">Clique em um processo para ver a movimentação completa.</span></div>
    ${tabela("t-est",[{t:"Processo"},{t:"Assunto"},{t:"Setor"},{t:"Veio de"},{t:"Chegou em"},{t:"Situação"},{t:"Tempo no setor",n:1},{t:"Dias úteis",n:1},{t:v ? "Total no setor" : "Total PROPLAN",n:1}], est, v ? `Nenhum processo está na ${v} neste momento.` : "Nenhum processo está em unidade da PROPLAN neste momento.")}
  </section>
  <section class="sec"><h2>Alertas</h2>${tabela("t-al",[{t:"Processo"},{t:"Local atual"},{t:"Alertas",ns:1}], al, "Nenhum alerta.")}</section>
  <section class="grid2">
    <div class="sec"><h2>De onde chegam ${v ? "à " + esc(v) : "os processos"}</h2>${tabela("t-ent",[{t:v ? "Unidade ou setor" : "Unidade"},{t:"Qtde",n:1},{t:"",ns:1}], lista(c.entradas), "Sem registros.")}</div>
    <div class="sec"><h2>Para onde saem da ${esc(alvo)}</h2>${tabela("t-sai",[{t:v ? "Unidade ou setor" : "Unidade"},{t:"Qtde",n:1},{t:"",ns:1}], lista(c.saidas), "Sem registros.")}</div>
  </section>`;
}

function telaProcessos(){
  const cfg = S.cfg; let as = analises();
  const q = norm(S.busca);
  if (V()) as = as.filter(a => a.passouAlvo);
  as = as.filter(a => (!q || norm(a.p.numero+" "+a.p.assunto+" "+(a.unidade||"")+" "+(a.p.assunto_detalhado||"")).includes(q))
    && (!S.filtroSetor || (S.filtroSetor === "_hoje" ? a.naProplan : a.passagens[S.filtroSetor]))
    && (!S.filtroSit || (S.filtroSit==="alerta" ? a.alertas.length : S.filtroSit==="aguard" ? a.aguardando && a.naProplan : S.filtroSit==="enc" ? a.encerrado : !a.encerrado)));
  as.sort((a,b)=> (b.noAlvo-a.noAlvo) || (b.tempoAlvo - a.tempoAlvo));
  const sig = cfg.setores.map(s=>s.sigla);
  const linhas = as.map(a => `<tr class="click" data-p="${a.p.chave}"><td class="mono">${esc(a.p.numero)}</td><td>${esc(a.p.assunto)}</td>
    <td>${a.naProplan ? chip(a.setor) : `<span class="note">${esc(a.unidade||"—")}</span>`} ${a.encerrado?`<span class="pill neu">${esc(a.p.status)}</span>`:""}</td>
    <td class="n" data-v="${a.diasAtual||0}">${diasPill(a)}</td>
    ${sig.map(s => `<td class="n" data-v="${a.porSetor[s]||0}">${a.porSetor[s]!==undefined ? dur(a.porSetor[s]) + (a.passagens[s]>1?` <span class="note">(${a.passagens[s]}×)</span>`:"") : `<span class="note">—</span>`}</td>`).join("")}
    <td class="n" data-v="${a.totalProplan}"><b>${dur(a.totalProplan)}</b></td><td class="n" data-v="${a.tramitacao||0}">${dur(a.tramitacao)}</td>
    <td class="n">${a.alertas.length ? `<span class="pill ${a.alertas.some(x=>x.nivel==="crit")?"crit":"warn"}">${a.alertas.length}</span>` : ""}</td></tr>`);
  return `${bannerExemplo()}
  ${S.sel ? telaDetalhe() : ""}
  <section class="sec">
    <div class="sec-head"><h2>${V() ? "Processos da " + esc(V()) : "Processos"} (${as.length})</h2>
      <div class="row"><button class="btn" id="exp-xlsx">Baixar planilha Excel</button></div></div>
    <div class="row">
      <input type="search" id="busca" placeholder="Buscar por número, assunto ou unidade" value="${esc(S.busca)}" aria-label="Buscar">
      <select id="f-setor" aria-label="Filtrar por setor"><option value="">Todos os setores</option><option value="_hoje" ${S.filtroSetor==="_hoje"?"selected":""}>Hoje na PROPLAN</option>
        ${sig.map(s=>`<option value="${esc(s)}" ${S.filtroSetor===s?"selected":""}>Passou por ${esc(s)}</option>`).join("")}</select>
      <select id="f-sit" aria-label="Filtrar por situação"><option value="">Qualquer situação</option>
        <option value="ativo" ${S.filtroSit==="ativo"?"selected":""}>Em andamento</option><option value="enc" ${S.filtroSit==="enc"?"selected":""}>Arquivados / concluídos</option>
        <option value="aguard" ${S.filtroSit==="aguard"?"selected":""}>Aguardando recebimento</option><option value="alerta" ${S.filtroSit==="alerta"?"selected":""}>Com alerta</option></select>
    </div>
    ${tabela("t-proc",[{t:"Processo"},{t:"Assunto"},{t:"Local atual"},{t:"Tempo no local atual",n:1},...sig.map(s=>({t:s,n:1})),{t:"Total PROPLAN",n:1},{t:"Tramitação",n:1},{t:"Alertas",n:1}], linhas, "Nenhum processo com esses filtros.")}
    <p class="note">Tempo corrido acumulado em cada setor (soma das passagens; entre parênteses, quantas vezes passou). A cor do tempo no local atual indica proximidade do limite de ${cfg.limite_parado} dias.</p>
  </section>`;
}

function telaDetalhe(){
  const p = dados().find(x=>x.chave===S.sel); if (!p) return "";
  const a = analisar(p, S.cfg, new Date());
  const linhas = a.perms.map(x => `<tr class="${x.setor?"pp":""}"><td>${chip(x.setor)} ${esc(x.unidade)}</td><td>${esc(x.veio)}</td>
    <td>${fd(x.inicio,true)}</td><td>${x.receb ? fd(x.receb,true) : (x.fim ? "—" : `<span class="pill warn">não recebido</span>`)}</td>
    <td>${x.fim ? fd(x.fim,true) : "<b>atual</b>"}</td><td class="n">${dur(x.dias)}</td><td class="n">${x.uteis}</td><td class="n">${dur(x.aguard)}</td></tr>`);
  const setoresPassou = Object.keys(a.porSetor);
  const quem = p.fonte === "automatico" ? `<span class="note">(busca automática)</span>` : p.atualizado_por ? `<span data-uid="${esc(p.atualizado_por)}"></span>` : "";
  return `<section class="sec" id="detalhe">
    <div class="det-head"><div><div class="num">${esc(p.numero)}</div><div>${esc(p.assunto)}</div>
      ${p.assunto_detalhado ? `<div class="note">${esc(p.assunto_detalhado)}</div>` : ""}</div>
      <div class="row"><button class="btn" id="copiar">Copiar número</button>
        <a class="btn" href="${URL_SIPAC}" target="_blank" rel="noopener">Abrir consulta no SIPAC</a>
        ${!ehExemplo() && S.podeEscrever !== false ? `<button class="btn danger" id="remover">Remover</button>` : ""}
        <button class="btn" id="fechar">Fechar</button></div></div>
    ${S.confirmar === p.chave ? `<div class="confirm"><span>Remover ${esc(p.numero)} da ferramenta? Os dados no SIPAC não são afetados.</span>
      <button class="btn danger" id="conf-sim">Remover</button><button class="btn" id="conf-nao">Cancelar</button></div>` : ""}
    <dl class="meta">
      <div><dt>Local atual</dt><dd>${a.setor ? chip(a.setor)+" " : ""}${esc(a.unidade||"—")}</dd></div>
      <div><dt>Há quanto tempo</dt><dd>${dur(a.diasAtual)} (${uteisTxt(a.uteisAtual||0)}) ${a.encerrado ? "" : sitPill(a)}</dd></div>
      <div><dt>Tramitação total</dt><dd>${dur(a.tramitacao)} desde ${fd(a.perms[0]?.inicio)}</dd></div>
      <div><dt>Total na PROPLAN</dt><dd>${dur(a.totalProplan)}</dd></div>
      <div><dt>Status · Origem</dt><dd>${esc(p.status||"—")} · ${esc(p.origem||"—")}</dd></div>
      <div><dt>Conferido no SIPAC em</dt><dd>${p.atualizado_em ? fd(conferidoEm(p),true) : "exemplo"} ${quem}</dd></div>
      <div><dt>Última mudança registrada</dt><dd>${p.atualizado_em ? fd(new Date(p.atualizado_em),true) : "—"}</dd></div>
    </dl>
    ${setoresPassou.length ? `<div class="legend">${setoresPassou.map(s=>`<span class="chip" style="--c:${S.cfg.cor(s)}"><i></i>${esc(s)}: ${dur(a.porSetor[s])} · ${uteisTxt(a.uteisSetor[s])}${a.passagens[s]>1?` · ${a.passagens[s]}×`:""}</span>`).join("")}</div>` : ""}
    ${strip(a)}
    ${a.alertas.length ? `<div>${a.alertas.map(x=>`<div><span class="pill ${x.nivel}">${x.nivel==="crit"?"crítico":x.nivel==="warn"?"atenção":"registro"}</span> ${esc(x.t)}</div>`).join("")}</div>` : ""}
    ${tabela("t-det",[{t:"Unidade",ns:1},{t:"Veio de",ns:1},{t:"Enviado em",ns:1},{t:"Recebido em",ns:1},{t:"Saiu em",ns:1},{t:"Tempo",n:1,ns:1},{t:"Dias úteis",n:1,ns:1},{t:"Até receber",n:1,ns:1}], linhas)}
  </section>`;
}

function telaAdicionar(){
  const reais = S.reais;
  const chaveLista = V() || "_geral";
  const listaVis = V() ? (S.listaPor[V()] || []) : S.lista;
  const setoresDe = n => Object.entries(S.listaPor).filter(([k,v]) => k !== "_geral" && v.includes(n)).map(([k]) => k);
  const pend = listaVis.map(n => { const k = numProc(n)?.chave; const p = k && reais.get(k);
    const conf = conferidoEm(p), idade = conf ? (Date.now()-conf)/DIA : null;
    return `<tr${p?` class="click" data-p="${k}"`:""}><td class="mono">${esc(n)}</td><td>${p ? (idade > 7 ? `<span class="pill warn">atualizado há ${Math.floor(idade)} dias</span>` : `<span class="pill ok">em dia</span>`) : (S.fila.has(k) ? `<span class="pill warn">na fila de busca</span>` : `<span class="pill neu">aguardando busca</span>`)}</td>
    <td>${conf ? fd(conf,true) : ""}</td>${V() ? "" : `<td>${setoresDe(n).map(chip).join(" ")}</td>`}</tr>`; });
  const so = S.podeEscrever === false;
  const fila = [...S.fila.values()].sort((a,b)=> (a.solicitado_em||"") < (b.solicitado_em||"") ? 1 : -1);
  return `<section class="sec">
    <div class="sec-head"><h2>Adicionar processo pelo número${V() ? " – " + esc(V()) : ""}</h2><span class="note">A busca no SIPAC começa na hora. Depois, todos os processos são atualizados de hora em hora, das 07h às 18h.</span></div>
    <form class="row" id="form-num">
      <input type="text" id="novo-num" placeholder="23074.012345/2026-56" aria-label="Número do processo" style="flex:1 1 260px;max-width:420px" ${so||!S.db?"disabled":""}>
      <button class="btn pri" type="submit" ${so||!S.db?"disabled":""}>Adicionar</button>
    </form>
    <span class="note">Pode colar vários números de uma vez. Cada processo entra na fila e na lista de acompanhamento ${V() ? "da " + esc(V()) : "geral"}, que é atualizada de hora em hora, das 07h às 18h.</span>
    ${fila.length ? tabela("t-fila",[{t:"Na fila de busca"},{t:"Pedido em"}], fila.map(f=>`<tr><td class="mono">${esc(f.numero)}</td><td>${f.solicitado_em ? fd(new Date(f.solicitado_em),true) : ""}</td></tr>`)) : ""}
  </section>
  ${S.imediata ? `<div class="banner"><span>${S.imediata.estado === "enviando" ? "Iniciando a busca no SIPAC…" :
     S.imediata.estado === "ok" ? `<b>Busca imediata iniciada às ${fd(S.imediata.quando,true).slice(-5)}.</b> O processo aparece no painel assim que a busca terminar, em geral em poucos minutos.` :
     S.imediata.estado === "falhou" ? `<b>Busca imediata indisponível:</b> ${esc(S.imediata.motivo)}. O processo está na fila e será buscado na próxima atualização.` :
     `O processo está na fila e será buscado na próxima atualização.`}</span></div>` : ""}
  ${statusColetor()}
  <section class="sec">
    <h2>Colar a página do processo (alternativa manual)</h2>
    ${so ? `<div class="banner"><span>Seu acesso a esta ferramenta é <b>somente leitura</b>. Peça ao responsável acesso de Colaborador para adicionar processos.</span></div>` : ""}
    ${!S.db ? `<div class="banner"><span><b>Modo local:</b> o armazenamento compartilhado não está disponível nesta visualização. O que você colar aqui fica só nesta aba.</span></div>` : ""}
    <ol class="steps">
      <li>Abra a <a href="${URL_SIPAC}" target="_blank" rel="noopener">consulta pública de processos do SIPAC</a>, busque o processo e abra a tela de detalhes, que mostra as movimentações.</li>
      <li>Selecione tudo (<b>Ctrl+A</b>) e copie (<b>Ctrl+C</b>).</li>
      <li>Clique na área abaixo e cole (<b>Ctrl+V</b>). O processo é lido e salvo na hora, sem esperar a atualização automática.</li>
    </ol>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Área para colar ou soltar processos">
      <b>Clique aqui e cole a página do processo (Ctrl+V)</b>
      <span class="note">Também aceita arquivos .html salvos pelo navegador (Ctrl+S). Arraste vários de uma vez ou
      <button class="btn" id="escolher" type="button">escolha arquivos</button></span>
    </div>
    ${S.erros?.length ? `<div>${S.erros.map(e=>`<div><span class="pill crit">não lido</span> ${esc(e)}</div>`).join("")}</div>` : ""}
  </section>
  <section class="sec">
    <div class="sec-head"><h2>Lista de acompanhamento ${V() ? "da " + esc(V()) : "geral"}</h2><span class="note">${V() ? `Processos que a ${esc(V())} acompanha. Cada setor tem a sua lista.` : "Processos sem setor definido. As listas de cada setor ficam na visão do setor (seletor no topo)."}</span></div>
    <textarea id="lista" rows="4" placeholder="Cole aqui números de processo, um por linha ou misturados com texto (ex.: a relação de processos da unidade no SIPAC)">${esc((S.listaPor[chaveLista]||[]).join("\n"))}</textarea>
    <div class="row"><button class="btn pri" id="salvar-lista" ${so?"disabled":""}>Salvar lista</button><span class="note">${(S.listaPor[chaveLista]||[]).length} processo(s) nesta lista${V() ? "" : ` · ${S.lista.length} no total, somando todos os setores`}</span></div>
    ${tabela("t-lista",[{t:"Processo"},{t:"Situação na ferramenta"},{t:"Conferido no SIPAC em"}, ...(V() ? [] : [{t:"Setores"}])], pend, "A lista está vazia.")}
  </section>`;
}

function telaSetores(){
  const c = S.cfgRaw, pode = S.podeAdmin || !S.db;
  const itens = c.setores.map((s,i) => `<div class="cfg-item" data-i="${i}">
    <label>Sigla<input type="text" id="cs-sig-${i}" value="${esc(s.sigla)}" ${pode?"":"disabled"}></label>
    <label>Nome<input type="text" id="cs-nome-${i}" value="${esc(s.nome)}" ${pode?"":"disabled"}></label>
    <label>Códigos SIPAC (vírgula)<input type="text" id="cs-cod-${i}" value="${esc((s.codigos||[]).join(", "))}" placeholder="ex.: 11.01.07.04" ${pode?"":"disabled"}></label>
    <label>Padrões do nome (um por linha)<textarea id="cs-pad-${i}" rows="2" ${pode?"":"disabled"}>${esc((s.padroes||[]).join("\n"))}</textarea></label></div>`).join("");
  const unid = new Map(); for (const p of dados()) for (const m of p.movs||[]) for (const u of [m.origem,m.destino]) if (u) unid.set(u,(unid.get(u)||0)+1);
  const linhasU = [...unid.entries()].sort((a,b)=>b[1]-a[1]).slice(0,60).map(([u,n]) => `<tr><td>${esc(u)}</td><td>${chip(S.cfg.setorDe(u)) || `<span class="note">externa</span>`}</td><td class="n">${n}</td></tr>`);
  const links = [["", "Toda a PROPLAN"], ...S.cfg.setores.map(s => [s.sigla, `${s.sigla} – ${s.nome}`])].map(([sig, nome]) =>
    `<div><span><b>${esc(nome)}</b><br><code>${esc(ARTIFACT_URL + (sig ? "#" + sig : ""))}</code></span><button class="btn" data-copiar="${esc(ARTIFACT_URL + (sig ? "#" + sig : ""))}">Copiar</button></div>`).join("");
  return `<section class="sec">
    <div class="sec-head"><h2>Link de cada setor</h2><span class="note">Envie a cada unidade o seu link. Ele abre a ferramenta já filtrada para o setor.</span></div>
    <div class="links">${links}</div>
  </section>
  <section class="sec">
    <div class="sec-head"><h2>Setores da PROPLAN</h2><span class="note">${pode ? "A primeira regra que casar define o setor. Deixe a PROPLAN (Gabinete) por último." : "Somente editores podem alterar estas regras."}</span></div>
    <p class="note">O critério mais seguro é o <b>código SIPAC</b> da unidade, que aparece entre parênteses no nome, como em “PROPLAN - COORDENAÇÃO DE ORÇAMENTO (11.01.07.04)”. Um código terminado em <span class="mono">.*</span> vale para todas as unidades abaixo dele (<span class="mono">11.00.61.*</span> = tudo abaixo do Gabinete da PROPLAN). Os padrões do nome são comparados em maiúsculas e sem acentos. Evite padrões genéricos: “COORDENACAO DE ORCAMENTO” sozinho também pega a “SOF - COORDENAÇÃO DE ORÇAMENTO E FINANÇAS”.</p>
    <div class="cfg-grid">${itens}</div>
    <h3>Alertas e prazos</h3>
    <div class="row">
      <label class="note">Parado no setor a partir de (dias) <input type="number" id="c-parado" min="1" value="${c.limite_parado}" ${pode?"":"disabled"}></label>
      <label class="note">Aguardando recebimento a partir de (dias) <input type="number" id="c-receb" min="1" value="${c.limite_receb}" ${pode?"":"disabled"}></label>
      <label class="note">Passagens repetidas a partir de <input type="number" id="c-pass" min="2" value="${c.limite_passagens}" ${pode?"":"disabled"}></label>
    </div>
    <label class="note">Feriados e recessos extras, além dos nacionais, Carnaval e 05/08 (dd/mm/aaaa, um por linha)
      <textarea id="c-fer" rows="3" ${pode?"":"disabled"}>${esc((c.feriados_extras||[]).join("\n"))}</textarea></label>
    ${pode ? `<div class="row"><button class="btn pri" id="salvar-cfg">Salvar regras</button><button class="btn" id="padrao-cfg">Restaurar padrão</button></div>` : ""}
  </section>
  <section class="sec"><div class="sec-head"><h2>Como as unidades estão sendo classificadas</h2><span class="note">Confira se cada unidade caiu no setor certo.</span></div>
    ${tabela("t-unid",[{t:"Unidade (como aparece no SIPAC)"},{t:"Setor"},{t:"Movimentações",n:1}], linhasU)}</section>`;
}

/* ================================================================ render e eventos */
function render(){
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.v === S.view)));
  const app = $("#app"), foco = document.activeElement?.id, pos = foco && document.activeElement.selectionStart;
  app.innerHTML = S.view === "painel" ? telaPainel() : S.view === "processos" ? telaProcessos() : S.view === "adicionar" ? telaAdicionar() : telaSetores();
  if (foco && $("#"+foco)) { const el = $("#"+foco); el.focus(); try { if (pos != null) el.setSelectionRange(pos,pos); } catch {} }
  resolverNomes();
}
async function resolverNomes(){
  const els = [...document.querySelectorAll("[data-uid]")]; if (!els.length || !S.user) return;
  try { const ps = await S.user.profiles(els.map(e=>e.dataset.uid)); els.forEach(e => { const n = ps[e.dataset.uid]?.name; e.textContent = n ? `por ${n}` : ""; }); } catch {}
}
function abrir(chave){ S.sel = chave; S.confirmar = null; S.view = "processos"; render(); $("#detalhe")?.scrollIntoView({block:"start"}); }

document.addEventListener("click", async ev => {
  const t = ev.target;
  const tab = t.closest("#tabs button"); if (tab){ S.view = tab.dataset.v; S.erros = null; render(); return; }
  const ir = t.closest("[data-ir]"); if (ir){ S.view = ir.dataset.ir; render(); return; }
  const cp = t.closest("[data-copiar]"); if (cp){ try { await navigator.clipboard.writeText(cp.dataset.copiar); toast("Link copiado."); } catch { toast(cp.dataset.copiar); } return; }
  const th = t.closest("th:not(.ns)"); if (th){ ordenar(th); return; }
  const tr = t.closest("tr[data-p]"); if (tr && !t.closest("a,button")){ abrir(tr.dataset.p); return; }
  switch (t.id){
    case "fechar": S.sel = null; render(); break;
    case "remover": S.confirmar = S.sel; render(); break;
    case "conf-nao": S.confirmar = null; render(); break;
    case "conf-sim": await removerProcesso(S.confirmar); S.confirmar = null; break;
    case "copiar": { const p = dados().find(x=>x.chave===S.sel); try { await navigator.clipboard.writeText(p.numero); toast("Número copiado."); } catch { toast(p.numero); } break; }
    case "escolher": $("#arquivos").click(); break;
    case "drop": $("#drop").focus(); break;
    case "salvar-lista": await salvarLista(); break;
    case "salvar-cfg": { let raw; try { raw = lerCfgForm(); } catch(e){ toast(e.message); break; } await salvarCfg(raw); break; }
    case "padrao-cfg": await salvarCfg(JSON.parse(JSON.stringify(CFG_PADRAO))); break;
    case "exp-xlsx": await exportar(); break;
  }
});
document.addEventListener("submit", ev => {
  if (ev.target.id === "form-num"){ ev.preventDefault(); solicitar($("#novo-num").value); }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "busca"){ S.busca = ev.target.value; render(); }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "visao"){ definirVisao(ev.target.value, true); render(); return; }
  if (ev.target.id === "f-setor"){ S.filtroSetor = ev.target.value; render(); }
  if (ev.target.id === "f-sit"){ S.filtroSit = ev.target.value; render(); }
});
document.addEventListener("paste", ev => {
  if (S.view !== "adicionar" || ["lista","c-fer","novo-num"].includes(document.activeElement?.id) || document.activeElement?.closest?.(".cfg-item")) return;
  ev.preventDefault();
  const html = ev.clipboardData.getData("text/html"), texto = ev.clipboardData.getData("text/plain");
  if (!html && !texto){ toast("A área de transferência está vazia."); return; }
  importar([html ? {html} : {texto}]);
});
$("#arquivos").addEventListener("change", async ev => { await lerArquivos(ev.target.files); ev.target.value = ""; });
document.addEventListener("dragover", ev => { const d = $("#drop"); if (d && ev.dataTransfer?.types?.includes("Files")){ ev.preventDefault(); d.classList.add("on"); } });
document.addEventListener("dragleave", ev => { if (ev.target.id === "drop") ev.target.classList.remove("on"); });
document.addEventListener("drop", async ev => { const d = $("#drop"); if (!d) return; ev.preventDefault(); d.classList.remove("on"); await lerArquivos(ev.dataTransfer.files); });
async function lerArquivos(files){
  const arr = []; for (const f of files){ const txt = await lerArquivoTexto(f); arr.push(/<table|<html/i.test(txt) ? {html:txt, nome:f.name} : {texto:txt, nome:f.name}); }
  if (arr.length) importar(arr);
}
async function lerArquivoTexto(f){
  const buf = await f.arrayBuffer(); let txt = new TextDecoder("utf-8").decode(buf);
  if (txt.includes("\uFFFD")) txt = new TextDecoder("iso-8859-1").decode(buf); // páginas antigas do SIPAC em Latin-1
  return txt;
}
function ordenar(th){
  const tb = th.closest("table").tBodies[0]; if (!tb) return; const i = [...th.parentNode.children].indexOf(th);
  const asc = th.dataset.asc !== "1"; th.parentNode.querySelectorAll("th").forEach(x=>delete x.dataset.asc); th.dataset.asc = asc ? "1" : "0";
  const val = r => { const c = r.cells[i]; return c?.dataset.v ?? c?.textContent.trim() ?? ""; };
  [...tb.rows].sort((a,b) => { const x = val(a), y = val(b), nx = parseFloat(x), ny = parseFloat(y);
    const r = (!isNaN(nx) && !isNaN(ny) && /^-?[\d.]+(e-?\d+)?$/.test(x) && /^-?[\d.]+(e-?\d+)?$/.test(y)) ? nx-ny : x.localeCompare(y,"pt-BR",{numeric:true}); return asc ? r : -r; })
    .forEach(r => tb.appendChild(r));
}

async function solicitar(texto){
  const nums = todosNums(texto);
  if (!nums.size){ toast("Digite um número de processo no formato 23074.000000/2026-00."); return; }
  if (!S.db){ toast("A busca automática só funciona com o armazenamento compartilhado disponível."); return; }
  const agora = new Date().toISOString(); let n = 0;
  try {
    for (const [chave, numero] of nums){
      if (S.fila.has(chave)) continue;
      await S.db.collection("solicitacoes").doc(chave).set({numero, setor:V() || null, solicitado_em:agora, por:S.uid || null}); n++;
    }
    const k = V() || "_geral", atual = S.listaPor[k] || [];
    const novos = [...nums.values()].filter(x => !atual.includes(x));
    if (novos.length) await gravarLista({...S.listaPor, [k]: [...atual, ...novos]});
  } catch(e){ toast(e?.code === "invalid_argument" ? "Sem permissão para adicionar processos." : "Não foi possível registrar agora. Tente de novo."); return; }
  const inp = $("#novo-num"); if (inp) inp.value = "";
  await buscaImediata([...nums.values()]);
}
/* Dispara a rotina de atualização na hora, pelo conector Claude Code Remote do próprio usuário.
   Sem o conector (ou para quem não é dono da rotina), o processo fica na fila para a próxima hora cheia. */
async function buscaImediata(numeros){
  const fila = "O processo foi para a fila e será buscado na próxima atualização (07h às 18h, de hora em hora).";
  const mcp = window.claude?.use ? await window.claude.use("mcp").catch(()=>null) : null;
  if (!mcp){ S.imediata = {estado:"fila"}; render(); toast(fila); return; }
  S.imediata = {estado:"enviando", quando:new Date()}; render();
  try {
    await mcp.callTool("Claude Code Remote", "fire_trigger", {trigger_id:ROTINA,
      text:"BUSCA IMEDIATA disparada pela página: processe agora somente as solicitações pendentes da coleção solicitacoes (" + numeros.join(", ") + "), sem percorrer a lista de acompanhamento inteira, e grave o status normalmente."});
    S.imediata = {estado:"ok", quando:new Date()}; toast("Busca no SIPAC iniciada. O resultado aparece aqui em alguns minutos.");
  } catch(e){
    const motivo = {server_not_connected:"o conector Claude Code Remote não está conectado na sua conta",
      needs_reauth:"o conector Claude Code Remote precisa ser reconectado em Configurações → Conectores",
      not_in_manifest:"a busca imediata não foi autorizada nesta página", blocked_by_policy:"a política da organização bloqueia a busca imediata",
      tool_error:"a rotina recusou o disparo (somente o dono da rotina pode iniciá-la)"}[e?.code];
    S.imediata = {estado:"falhou", motivo: motivo || "o disparo não respondeu"};
    toast(fila);
  }
  render();
}
function proximaExecucao(){
  const d = new Date(); d.setSeconds(0,0);
  for (let i=0;i<60*48;i++){ d.setMinutes(d.getMinutes()+1); if (d.getMinutes()===2 && d.getHours()>=7 && d.getHours()<=18) return fd(d,true); }
  return "—";
}
function statusColetor(){
  const st = S.status;
  if (!S.db) return "";
  if (!st) return `<div class="banner"><span><b>Busca automática:</b> aguardando a primeira execução. A atualização roda de hora em hora, das 07h às 18h.</span></div>`;
  const quando = st.ultima_execucao ? fd(new Date(st.ultima_execucao), true) : "—";
  const prox = proximaExecucao();
  const falhas = (st.falhas||[]);
  const erroGeral = st.erro_geral ? `<div><span class="pill crit">falha</span> ${esc(st.erro_geral)}</div>` : "";
  return `<section class="sec"><div class="sec-head"><h2>Atualização automática</h2>
    <span class="note">Última: ${quando} · próxima por volta de ${prox}</span></div>
    <div class="row"><span class="pill ${st.erro_geral ? "crit" : falhas.length ? "warn" : "ok"}">${st.erro_geral ? "SIPAC inacessível" : `${st.verificados ?? st.atualizados ?? 0} de ${st.total||0} conferidos${st.alterados != null ? ` · ${st.alterados + (st.novos||0)} com mudança` : ""}${st.pulados_encerrados ? ` · ${st.pulados_encerrados} encerrados (conferidos às 07h)` : ""}`}</span>
    ${S.fila.size ? `<span class="pill neu">${S.fila.size} na fila</span>` : ""}</div>
    ${erroGeral}${falhas.slice(0,8).map(f=>`<div class="note"><span class="mono">${esc(f.numero)}</span>: ${esc(f.erro)}</div>`).join("")}</section>`;
}
async function salvarLista(){
  const nums = [...todosNums($("#lista").value).values()];
  const por = {...S.listaPor, [V() || "_geral"]: nums};
  try { await gravarLista(por); toast(`Lista ${V() ? "da " + V() : "geral"} salva com ${nums.length} processo(s).`); }
  catch(e){ toast(e?.code==="invalid_argument" ? "Sem permissão para alterar a lista." : "Não foi possível salvar a lista."); }
}
function lerCfgForm(){
  const setores = S.cfgRaw.setores.map((_,i) => ({ sigla:limpa($(`#cs-sig-${i}`).value).toUpperCase(), nome:limpa($(`#cs-nome-${i}`).value),
    codigos:$(`#cs-cod-${i}`).value.split(/[,;\s]+/).map(limpa).filter(Boolean),
    padroes:$(`#cs-pad-${i}`).value.split("\n").map(s=>s.trim()).filter(Boolean) })).filter(s=>s.sigla);
  for (const s of setores) for (const p of s.padroes){ try { new RegExp(p); } catch { throw new Error(`Padrão inválido em ${s.sigla}: ${p}`); } }
  return { setores, limite_parado:+$("#c-parado").value||15, limite_receb:+$("#c-receb").value||3, limite_passagens:+$("#c-pass").value||3,
    feriados_extras:$("#c-fer").value.split("\n").map(limpa).filter(Boolean) };
}
async function salvarCfg(raw){
  if (S.db){ try { await S.db.doc("config/setores").set(raw); toast("Regras salvas."); }
    catch(e){ toast(e?.code==="invalid_argument" ? "Somente editores podem alterar as regras." : "Não foi possível salvar as regras."); } }
  else { aplicarCfg(raw); toast("Regras aplicadas (somente nesta aba)."); }
}
function aplicarCfg(raw){ S.cfgRaw = raw && raw.setores?.length ? raw : CFG_PADRAO; S.cfg = compilarCfg(S.cfgRaw); montarSeletor(); render(); }

async function exportar(){
  if (!window.XLSX){ toast("A biblioteca de planilhas não carregou. Recarregue a página."); return; }
  const as = analises().filter(a => !V() || a.passouAlvo), cfg = S.cfg, sig = cfg.setores.map(s=>s.sigla), r2 = x => Math.round((x||0)*100)/100;
  const c = consolidar(as, cfg, V());
  const wb = XLSX.utils.book_new();
  const add = (nome, linhas) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhas), nome);
  add("Resumo por setor", c.setores.map(s => ({"Setor":s.sigla,"Nome":s.nome,"Processos":s.procs,"Passagens":s.pass,"Tempo médio por passagem":dur(media(s.dias)),"Média dias/passagem (decimal)":r2(media(s.dias)),
    "Mediana":r2(med(s.dias)),"Máximo":r2(s.dias.length?Math.max(...s.dias):0),"Média até receber":r2(media(s.aguard)),"Estoque hoje":s.estoque,
    "Idade média estoque":r2(media(s.idade)),[`Estoque >= ${cfg.limite_parado} dias`]:s.acima})));
  add("Processos", as.map(a => Object.assign({"Processo":a.p.numero,"Assunto":a.p.assunto,"Status":a.p.status,"Autuação":fd(deIso(a.p.autuacao)),
    "Unidade atual":a.unidade||"","Setor atual":a.setor||"","Aguardando recebimento":a.aguardando?"SIM":"NÃO","Tempo no local atual":dur(a.diasAtual),"Dias no local atual (decimal)":r2(a.diasAtual),"Dias úteis no local atual":a.uteisAtual||0},
    Object.fromEntries(sig.map(s=>[`Dias ${s}`, r2(a.porSetor[s])])), Object.fromEntries(sig.map(s=>[`Passagens ${s}`, a.passagens[s]||0])),
    {"Tempo total PROPLAN":dur(a.totalProplan),"Total dias PROPLAN (decimal)":r2(a.totalProplan),"Tramitação total (dias)":r2(a.tramitacao),"Alertas":a.alertas.map(x=>x.t||x).join(" | ")})));
  add("Permanências", as.flatMap(a => a.perms.map((x,i) => ({"Processo":a.p.numero,"Seq":i+1,"Unidade":x.unidade,"Setor PROPLAN":x.setor||"","Veio de":x.veio,"Foi para":x.foi,
    "Enviado em":fd(x.inicio,true),"Recebido em":fd(x.receb,true),"Saiu em":x.fim?fd(x.fim,true):"atual","Tempo":dur(x.dias),"Dias (decimal)":r2(x.dias),"Dias úteis":x.uteis,"Dias até receber":r2(x.aguard)}))));
  add("Movimentações", dados().flatMap(p => (p.movs||[]).map((m,i) => ({"Processo":p.numero,"Seq":i+1,"Enviado em":fd(deIso(m.envio),true),"Origem":m.origem,"Destino":m.destino,
    "Enviado por":m.enviado_por||"","Recebido em":fd(deIso(m.receb),true),"Recebido por":m.recebido_por||"","Urgente":m.urgente?"SIM":""}))));
  const buf = XLSX.write(wb, {bookType:"xlsx", type:"array"});
  const nome = `tramitacao_${(V() || "proplan").toLowerCase()}_${chaveDia(new Date())}.xlsx`;
  const dl = window.claude?.use ? await window.claude.use("downloads").catch(()=>null) : null;
  if (!dl){ toast("Download indisponível nesta visualização."); return; }
  try { await dl.save({filename:nome, data:new Blob([buf])}); }
  catch(e){ if (e?.code !== "declined") toast(e?.code === "rate_limited" ? "Aguarde um instante e tente de novo." : "Não foi possível gerar o download."); }
}

/* ================================================================ inicialização */
(function(){
  const h = (location.hash || "").slice(1).toUpperCase();
  let salvo = ""; try { salvo = localStorage.getItem("visao") || ""; } catch {}
  montarSeletor(); definirVisao(h || salvo, false);
})();
window.addEventListener("hashchange", () => { definirVisao((location.hash||"").slice(1).toUpperCase(), true); render(); });
render();
(async () => {
  if (!window.claude?.use) return;
  const [db, user] = await Promise.all([window.claude.use("db").catch(()=>null), window.claude.use("user").catch(()=>null)]);
  S.user = user;
  if (user){ S.uid = await user.id(); S.podeAdmin = await user.canEdit(); const w = await user.can("data.write"); if (w === false) S.podeEscrever = false; }
  if (!db){ render(); return; }
  S.db = db;
  db.collection("processos").onSnapshot(snap => {
    S.reais = new Map(snap.docs.map(d => [d.id, d.data()])); S.carregou = true; render();
  }, () => toast("Conexão com os dados perdida. Recarregue a página."));
  db.collection("solicitacoes").onSnapshot(snap => { S.fila = new Map(snap.docs.map(d => [d.id, d.data()])); if (document.activeElement?.id !== "novo-num") render(); }, ()=>{});
  db.doc("status/coletor").onSnapshot(s => { S.status = s.exists ? s.data() : null; if (document.activeElement?.id !== "novo-num") render(); }, ()=>{});
  db.doc("config/setores").onSnapshot(s => aplicarCfg(s.exists ? s.data() : null), ()=>{});
  db.doc("acompanhamento/lista").onSnapshot(s => { aplicarLista(s.exists ? s.data() : null); if (S.view === "adicionar" && document.activeElement?.id !== "lista") render(); }, ()=>{});
  render();
})();
</script>
